<style>
  :root{ --bg:#f4f6f9; --card:#fff; --ink:#1a2230; --sub:#5b6675; --line:#dde3ea;
         --blue:#1f6feb; --blueD:#1552b8; --ok:#1a8f4a; --warn:#c9761a; --bad:#c23a3a;
         --jobs:#1f6feb; --trans:#7a3fd6; --start:#1a8f4a; --pend:#c9761a; --none:#8a94a2; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:'Malgun Gothic','맑은 고딕',system-ui,sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:920px;margin:0 auto;padding:14px}

  .top .sp{flex:1}
  .top .sub{color:var(--sub);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}

  h3{font-size:15px;margin:16px 0 8px;color:var(--ink)}

  .hint{color:var(--sub);font-size:13px;font-weight:400}
  input[type=text],input[type=number],textarea,select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit}
  textarea{min-height:64px;resize:vertical}
  .opt{display:inline-flex;align-items:center;gap:6px;margin:4px 10px 4px 0;font-weight:400;cursor:pointer}
  .opt input{width:auto}
  .btn{display:inline-block;background:var(--blue);color:#fff;border:none;border-radius:8px;
       padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--blueD)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.gray{background:#e8edf3;color:var(--ink)}
  .btn.gray:hover{background:#dce3ec}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .seg button{background:#eef2f7;border:1px solid var(--line);padding:8px 14px;cursor:pointer;font-weight:700}
  .seg button:first-child{border-radius:8px 0 0 8px}
  .seg button:last-child{border-radius:0 8px 8px 0;border-left:none}
  .seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .clsseg{display:inline-flex;margin-right:10px}

  .clsseg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

  .subnav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  /* 활동 허브 */

  .toast.on{opacity:1}
  .note{background:#eef4ff;border:1px solid #cfe0ff;border-radius:8px;padding:10px 12px;color:#234;font-size:13px}
  .muted{color:var(--sub);font-size:13px}
  .prof-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fafcff}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin-top:6px}
  .kv .k{color:var(--sub);font-weight:700}
  .demoflag{background:#fff6e6;border:1px solid #f0d79a;border-radius:8px;padding:8px 12px;font-size:12px;color:#7a5a10;margin-bottom:12px}
  /* 설문 위저드 */
  .wizard-head{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .wstep{flex:1;min-width:64px;text-align:center;padding:8px 4px;border-radius:8px;background:#eef2f7;
         color:var(--sub);font-size:12.5px;font-weight:700;border:1px solid var(--line)}
  .wstep.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .wstep.done{background:#e3f0ff;color:var(--blueD);border-color:#cfe0ff}
  .wprog{color:var(--sub);font-size:13px;margin:2px 0 6px}
  .stephead{font-size:17px;font-weight:800;margin:8px 0 2px}
  .qcard{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;
         background:#fafcff;padding:14px 16px;margin:16px 0}
  .qhead{font-weight:700;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px;line-height:1.45}
  .qbadge{display:inline-block;background:var(--blue);color:#fff;border-radius:6px;padding:2px 9px;
          font-size:12px;font-weight:800;flex:none;margin-top:1px}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:20px;
          border-top:1px solid var(--line);padding-top:14px}
  .qcard.invalid{border-color:var(--bad);border-left-color:var(--bad);background:#fff5f5}
  .qcard.invalid .qbadge{background:var(--bad)}
  .qerr{color:var(--bad);font-size:12.5px;font-weight:700;margin-top:9px}
  .validbanner{background:#fdecea;border:1px solid #f3b7b0;color:#a12820;border-radius:8px;
               padding:10px 13px;font-size:13.5px;font-weight:700;margin:12px 0}
  .reqmark{color:var(--bad);font-weight:800;margin-left:3px}
  @media(max-width:560px){
    .wstep{font-size:11px;min-width:0;padding:7px 2px} .wrap{padding:10px}
    /* 상단바 — 좁은 폭에서 글자단위로 세로로 쪼개지는 것 방지: 줄바꿈 허용 */
    .top{flex-wrap:wrap; gap:6px}
    .top .sp{flex-basis:100%; height:0; margin:0}
    .top .ttl{font-size:15px}
    .top .sub{font-size:12px}
    .clsseg{margin:4px 6px 4px 0}
    /* 표 — 열이 많아 압축되는 것 방지: 셀은 줄바꿈 금지, 카드 안에서 가로 스크롤 */
    .card{overflow-x:auto}
    table{font-size:12px}
    table th, table td{padding:6px 5px; white-space:nowrap}
  }
</style>
</head>
<body>

<script>
/* ============================================================================
   0. 설정 — local 모드(브라우저 저장). 운영본은 여기서 Supabase remote 로 바꿉니다.
   ========================================================================== */
/* 기본 remote(배포). 주소 끝에 ?demo=1 을 붙이면 local(가짜 예시 데이터)로 테스트. */
var MODE = /[?&]demo=1/.test(location.search) ? 'local' : 'remote';
/* Supabase 연결정보 — anon 키는 공개돼도 되는 값(RLS로 학생 개인정보는 보호됨).
   민감 데이터는 Edge Function(api, service_role)을 통해서만 접근한다. */
var DBCONF = {
  url:'https://nasizwclypmaojvwfxnn.supabase.co',
  anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hc2l6d2NseXBtYW9qdndmeG5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjI4NzcsImV4cCI6MjEwMzU5ODg3N30.216EMXLF9BFXsxNraDuIV8_HaBMpulua8Pklyz9tMy4'
};
var APP_TITLE = '바이오취업역량개발';

/* ── 반(강좌) 정의 — 반별 담당 교수 ── */
/* 배포 빌드 — 담당 교수명은 공개 코드에 두지 않습니다(서버 accounts/classes에서 로드). */
var CLASSES = [
  { id:'F1', prof:'' },
  { id:'F2', prof:'' },
  { id:'F3', prof:'' }
];
/* 🚀 배포 빌드 — 공개 코드에 실제 교수 계정을 두지 않습니다.
   교수 계정은 Supabase accounts 표에서 확인(edge_login). 기본은 비어 있습니다. */
var SEED_PROFS = [];
/* 로컬 테스트(?demo=1)용 예시 계정·명단 — 실명 아님(가짜). remote 모드에서는 쓰이지 않음. */
var DEMO_SEED = {
  profs: [
    { name:'예시교수A', num:'T0001', klass:'F2', role:'super' },
    { name:'예시교수B', num:'T0002', klass:'F1', role:'admin' },
    { name:'예시교수C', num:'T0003', klass:'F3', role:'admin' }
  ],
  roster: (function(){ var a=[], plan=[['F2',8],['F1',6],['F3',6]], i=0;
    plan.forEach(function(p){ for(var k=0;k<p[1];k++){ i++; a.push({ name:'예시학생'+(i<10?'0'+i:i), no:'9000'+(i<10?'0'+i:i)+'00', klass:p[0] }); } });
    return a; })()
};
var PROFS = SEED_PROFS;   /* 로그인 대조용 계정 — local(?demo=1)이면 시작 시 DEMO_SEED.profs 로 교체 */

/* ── 활동 목록 — 나중에 활동을 쉽게 추가/활성화하도록 배열로 관리 ──
   1차만 실제 화면(진로설문)과 연결·활성. 2~10차는 이름만, 비활성(준비 중). */
var ACTIVITIES = [
  { n:1, name:'진로 설문', key:'survey', active:true },
  { n:2, name:'2차 활동', key:'assets', active:false },
  { n:3, name:'3차 활동', active:false },
  { n:4, name:'4차 활동', active:false },
  { n:5, name:'5차 활동', active:false },
  { n:6, name:'6차 활동', active:false },
  { n:7, name:'7차 활동', active:false },
  { n:8, name:'8차 활동', active:false },
  { n:9, name:'9차 활동', active:false },
  { n:10, name:'10차 활동', active:false }
];

/* ============================================================================
   개인정보 수집·이용 동의 문구 (초안)
   ⚠️⚠️ 초안입니다 — 배포 전 반드시 학교 개인정보 심의를 받은 정식 문구로 교체할 것.
        특히 「보유·이용 기간(3항)」은 학교 규정 미확인 상태의 임시값(placeholder)입니다.
   ========================================================================== */
var CONSENT_HTML =
  '<p><b>「바이오취업역량개발」 교과목 진로지도</b>를 위해 아래와 같이 개인정보를 수집·이용합니다.</p>'+
  '<p><b>1. 수집 항목</b><br>성명, 학번, 진로설문 응답(희망 진로유형·분야·직무·근무지역·희망연봉·보유/준비 자격증·어학, 편입 정보[유형·연계대학·희망학과], 창업 정보[분야·아이템·준비단계], 대학원 진학 희망, 진로 준비도 및 주관식 응답 등)</p>'+
  '<p><b>2. 수집·이용 목적</b><br>「바이오취업역량개발」 교과목의 진로지도·상담 및 반·학과 단위 진로 현황 분석</p>'+
  '<p><b>3. 보유·이용 기간</b><br>수집일로부터 졸업 시까지</p>'+
  '<p><b>4. 제3자 제공</b><br>없음 (학과 진로지도 목적의 내부 활용에 한함)</p>'+
  '<p><b>5. 동의 거부 권리 및 불이익</b><br>귀하는 위 개인정보 수집·이용에 동의하지 않을 권리가 있습니다. 다만 동의하지 않을 경우 본 앱을 통한 진로설문·진로지도 활동 참여가 제한될 수 있습니다.</p>';

/* 🚀 배포 빌드 — 학생 명단은 공개 코드에 없습니다.
   remote: Supabase students 표에서 로드(또는 슈퍼관리자가 앱에서 출석부 등록).
   local(?demo=1): DEMO_SEED.roster(가짜)로 시드. */
var SEED_ROSTER = [];
function profOfClass(c){ var x=CLASSES.filter(function(k){return k.id===c;})[0]; return x?x.prof:''; }
function classLabel(c){ if(c==='ALL') return '전체'; var p=profOfClass(c); return p? c+'('+p+')' : c; }

/* ============================================================================
   1. 저장 계층 — PBL의 DB 추상화를 축약. 표이름→줄목록. local=localStorage.
   ========================================================================== */
var LSKEY='biocareer_deploy_v1';  /* 배포 빌드 로컬 테스트 저장키 */
var DB = {
  d:{ students:[], responses:[], interviews:[], activity2:[] },
  load:function(){ try{ var r=localStorage.getItem(LSKEY); if(r) this.d=JSON.parse(r); }catch(e){} },
  save:function(){ if(SESS&&SESS.previewAsStudent) return; try{ localStorage.setItem(LSKEY, JSON.stringify(this.d)); }catch(e){} },
  seed:function(){
    if(this.d.students.length) return;
    if(this.d.seeded) return;                  /* 한 번 시드/삭제된 뒤에는 다시 채우지 않음(전체·반별 삭제가 새로고침 후에도 유지되도록) */
    if(MODE!=='local') return;                 /* remote: 서버(Supabase)에서 로드 */
    var roster = (typeof DEMO_SEED!=='undefined') ? DEMO_SEED.roster : SEED_ROSTER;
    this.d.students = roster.map(function(s,i){
      return { id:'st'+(i+1), name:s.name, no:s.no, klass:s.klass||'F2' };
    });
    this.d.seeded = true;
    this.save();
  },
  student:function(name,no){
    var nm=norm(name);
    return this.d.students.filter(function(s){ return norm(s.name)===nm && s.no===no; })[0];
  },
  response:function(sid){ if(SESS&&SESS.previewAsStudent&&sid===PV_SID) return pvData.response||undefined; return this.d.responses.filter(function(r){return r.student_id===sid;})[0]; },
  activity2Of:function(sid){ if(SESS&&SESS.previewAsStudent&&sid===PV_SID) return pvData.activity2||undefined; return (this.d.activity2||[]).filter(function(r){return r.student_id===sid;})[0]; },
  saveActivity2Local:function(sid, klass, payload){
    if(!this.d.activity2) this.d.activity2=[];
    var r=this.activity2Of(sid);
    if(r){ r.assets=payload.assets; r.pros=payload.pros; r.cons=payload.cons; r.photos=payload.photos; r.klass=klass; r.submitted_at=now(); }
    else this.d.activity2.push({ id:'a2_'+(this.d.activity2.length+1), student_id:sid, klass:klass, assets:payload.assets, pros:payload.pros, cons:payload.cons, photos:payload.photos, submitted_at:now() });
    this.save();
  },
  saveResponse:function(sid, track, answers){
    var r=this.response(sid);
    if(r){ r.track=track; r.answers=answers; r.submitted_at=now(); delete r.demo; }  /* 실제 응답으로 덮으면 demo 플래그 해제 */
    else this.d.responses.push({ id:'r'+(this.d.responses.length+1), student_id:sid, track:track, answers:answers, submitted_at:now() });
    this.save();
  },
  /* ── 시연용 예시 데이터 (demo:true 플래그) ─────────────────────────────
     ⚠️ 실제 배포 단계에서는 아래 fillDemo/clearDemo 와 대시보드의 시연 버튼을
        반드시 숨기거나 제거할 것 (운영 중 교수가 실수로 누르지 않도록). */
  fillDemo:function(){
    this.clearDemo();                          /* 기존 예시만 지우고(실제 응답은 보존) 다시 채움 */
    var self=this, i=0;
    this.d.students.forEach(function(s){
      if(s.earlyEmployed) return;              /* 조기취업자는 설문 면제 → 예시도 생성 안 함 */
      if(self.response(s.id)) return;          /* 실제 응답이 있는 학생은 건드리지 않음 */
      var g=makeDemoAnswers();
      self.d.responses.push({ id:'d'+(++i)+'_'+s.id, student_id:s.id, track:g.track, answers:g.answers, submitted_at:now(), demo:true });
    });
    this.save();
  },
  clearDemo:function(){                          /* 예시(demo:true)만 삭제 — 실제 응답은 남김 */
    this.d.responses = this.d.responses.filter(function(r){ return !r.demo; });

  },
  demoCount:function(){ return this.d.responses.filter(function(r){return r.demo;}).length; }
};

/* ── 분기 로직을 지킨 그럴듯한 무작위 응답 1건 생성 ── */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickN(arr,min,max){ var n=min+Math.floor(Math.random()*(max-min+1)); var c=arr.slice(); var out=[]; while(out.length<n&&c.length){ out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); } return out; }
function optOf(id){ var q=Q.filter(function(x){return x.id===id;})[0]; return q?q.opt:[]; }
function makeDemoAnswers(){
  var a={};
  /* A1: 트랙 분포가 골고루 섞이게 가중 */
  var A1 = pick(['취업','취업','취업','편입','편입','창업','병행','미정']);
  a.A1=A1;
  if(A1==='병행'){ a.A2=pickN(['취업','편입','창업'],2,3); a.A3=pick(['취업','편입','창업','아직 반반']); }
  a.A4 = 1+Math.floor(Math.random()*5);
  if(A1==='미정') a.A5=pick(optOf('A5'));
  function fillTrackB(){
    a.B1=pickN(optOf('B1').filter(x=>x!=='기타'),1,3);
    a.B2=pickN(optOf('B2').filter(x=>x!=='기타'),1,2);
    a.B3=pickN(['서울','인천','경기','충청','강원','영남','호남','제주','상관없음'],1,3);
    a.B4=pickN(['없음','서울','인천','경기','충청','강원','영남','호남','제주'],1,2);
    a.B5=pick(optOf('B5')); a.B6=pickN(optOf('B6'),1,3);
    a.B7 = Math.random()<0.5 ? pick(['셀트리온','비티젠','한국콜마','녹십자','']) : '';
    a.B8=pickN(optOf('B8').filter(x=>x!=='기타'),1,2);
    a.B9 = pick(['없음','화학분석기능사','위험물산업기사','컴퓨터활용능력 1급']);
    a.B10=pick(optOf('B10')); if(a.B10==='보유(점수 입력)') a.B10a='TOEIC '+(600+Math.floor(Math.random()*35)*10);
    a.B11=pick(optOf('B11')); if(a.B11==='있음') a.B11a=pick(['비티젠 현장실습 2개월 QC','제약회사 인턴 1개월']);
  }
  function fillTrackC(){
    a.C1=pick(optOf('C1'));
    if(a.C1==='연계편입') a.C1a=pick(optOf('C1a'));
    if(a.C1==='학사편입') a.C2=pick(optOf('C2'));
    a.C3=pick(optOf('C3')); a.C4=pick(['생명공학과','화학공학과','식품생명공학과','바이오의약학과']);
    a.C5=pick(['강원대학교','고려대 세종','건국대 글로컬','서울권 대학']);
    a.C6=pick(optOf('C6')); a.C7=pickN(optOf('C7'),1,2);
    a.C8=pick(optOf('C8')); if(a.C8==='보유(점수 입력)') a.C8a='TOEIC '+(600+Math.floor(Math.random()*30)*10);
  }
  function fillTrackF(){
    a.F1=pick(optOf('F1')); a.F2=pickN(optOf('F2').filter(x=>x!=='기타'),1,3);
    a.F3 = Math.random()<0.5 ? pick(['천연물 화장품','반려동물 건강식품','바이오 진단키트','']) : '';
    a.F4=pick(optOf('F4')); a.F5=pickN(optOf('F5').filter(x=>x!=='기타'),1,3);
    a.F6=pick(optOf('F6')); a.F7=pickN(optOf('F7'),1,2);
    a.F8=pick(optOf('F8')); if(a.F8==='있음') a.F8a=pick(['교내 창업동아리 활동','창업경진대회 참가']);
  }
  if(hasTrack(a,'취업')) fillTrackB();
  if(hasTrack(a,'편입')) fillTrackC();
  if(hasTrack(a,'창업')) fillTrackF();
  /* D 대학원(전원) */
  a.D1=pick(['희망','미정','비희망']);
  if(a.D1==='희망'){ a.D2=pick(['미생물학','생명공학','식품공학','분자생물학']); a.D3=pick(optOf('D3')); a.D4=pick(optOf('D4')); }
  /* E 마무리(전원) */
  a.E1 = 1+Math.floor(Math.random()*5);
  a.E2 = pick(['진로 방향이 아직 확실하지 않아요','자격증 준비가 부족합니다','서류 작성이 막막해요','학점을 더 올리고 싶어요']);
  a.E3 = pickN(optOf('E3').filter(x=>x!=='기타'),1,3);
  return { track:A1, answers:a };
}

   ⚠️ 데이터 변경 함수는 슈퍼관리자만 호출(UI 게이트 + 아래 가드).

function rval(id){ var e=document.getElementById(id); return e? (''+e.value).trim() : ''; }
function classOptions(sel){ return CLASSES.map(function(c){ return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+c.id+'</option>'; }).join(''); }
function newSid(){ return 'st_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function addStudent(name,no,klass){
  if(!isSuper()) return {ok:false,msg:'슈퍼관리자만 가능합니다.'};

  if(!name||!no) return {ok:false,msg:'이름과 학번을 입력하세요.'};
  if(DB.d.students.some(function(s){return s.no===no;})) return {ok:false,msg:'이미 있는 학번입니다: '+no};
  DB.d.students.push({id:newSid(), name:name, no:no, klass:klass||'F1'}); DB.save(); return {ok:true};
}
function updateStudent(sid,name,no,klass){
  if(!isSuper()) return {ok:false,msg:'슈퍼관리자만 가능합니다.'};
  var st=DB.d.students.filter(function(x){return x.id===sid;})[0]; if(!st) return {ok:false,msg:'학생을 찾을 수 없습니다.'};
  name=(name||'').trim(); no=(no||'').trim();
  if(!name||!no) return {ok:false,msg:'이름과 학번을 입력하세요.'};
  if(DB.d.students.some(function(s){return s.no===no && s.id!==sid;})) return {ok:false,msg:'다른 학생과 학번이 겹칩니다: '+no};
  st.name=name; st.no=no; if(klass) st.klass=klass; DB.save(); return {ok:true};

function deleteStudent(sid){
  if(!isSuper()) return;
  DB.d.students = DB.d.students.filter(function(x){return x.id!==sid;});
  DB.d.responses = DB.d.responses.filter(function(r){return r.student_id!==sid;});
  DB.save();
}
function registerRoster(klass,list,mode){
  if(!isSuper()) return 0;
  if(mode==='overwrite'){
    var ids={}; DB.d.students.filter(function(s){return s.klass===klass;}).forEach(function(s){ids[s.id]=1;});
    DB.d.students = DB.d.students.filter(function(s){return s.klass!==klass;});
    DB.d.responses = DB.d.responses.filter(function(r){return !ids[r.student_id];});
  }
  var added=0;
  list.forEach(function(r){
    if(!r.name||!r.no) return;
    if(DB.d.students.some(function(s){return s.no===r.no;})) return;   /* 학번 중복 방지(전 반) */
    DB.d.students.push({id:newSid(), name:r.name, no:r.no, klass:klass}); added++;
  });
  DB.save(); return added;
}
/* 붙여넣기/PDF 텍스트 → [{name,no}] — 「학번 이름」·「이름 학번」 두 순서 다 지원 */
function parseRoster(text){
  function grab(re,noFirst){ var o=[],m; re.lastIndex=0; while((m=re.exec(text))){ o.push({name:noFirst?m[2]:m[1], no:noFirst?m[1]:m[2]}); } return o; }
  var a=grab(/(20\d{6})\s+([가-힣]{2,5})/g,true);       /* 학번 다음 이름 (출석부 PDF 순서) */
  var b=grab(/([가-힣]{2,5})\s+(20\d{6})/g,false);      /* 이름 다음 학번 (붙여넣기 흔한 순서) */
  var list=(a.length>=b.length)?a:b;
  var seen={}; return list.filter(function(r){ if(seen[r.no])return false; seen[r.no]=1; return true; });
}
/* PDF.js 지연 로드(사용할 때만, CDN) — 실패 시 붙여넣기/CSV 안내 */
function loadPdfJs(cb){
  if(window.pdfjsLib){ cb(true); return; }
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
  s.onload=function(){ try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; }catch(e){} cb(true); };
  s.onerror=function(){ cb(false); };
  document.head.appendChild(s);
}
function extractPdf(file,done){
  loadPdfJs(function(ok){
    if(!ok){ done(null); return; }
    var fr=new FileReader();
    fr.onload=function(){
      pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(pdf){
        var texts=[], chain=Promise.resolve();
        for(var i=1;i<=pdf.numPages;i++){ (function(n){ chain=chain.then(function(){ return pdf.getPage(n).then(function(pg){return pg.getTextContent();}).then(function(tc){ texts.push(tc.items.map(function(it){return it.str;}).join(' ')); }); }); })(i); }
        chain.then(function(){ done(texts.join('\n')); });
      }).catch(function(){ done(null); });
    };
    fr.readAsArrayBuffer(file);
  });
}

var SESS = { role:null, student:null, prof:null, classView:'ALL' };   // role: 'student' | 'prof'
/* ── 전역 「학생으로 보기」 미리보기 모드 (2026-09-07) ──
   교수가 학생이 로그인 후 보는 화면 전체를 학생 관점으로 둘러보는 체험 모드.
   가상(예시) 학생 컨텍스트로 렌더하며, 어떤 제출·저장도 서버/localStorage에 반영되지 않는다. */
var PV_SID='__preview__';
var pvData={ response:null, activity2:null };   /* 미리보기 전용 인메모리 — 서버·localStorage에 절대 저장 안 됨 */
function isPreview(){ return !!(SESS && SESS.previewAsStudent); }
function enterStudentPreview(){
  if(SESS.role!=='prof'){ return; }
  var kl=(viewClass()!=='ALL')? viewClass() : (CLASSES[0]?CLASSES[0].id:'F1');
  SESS.pvProf=SESS.prof; SESS.pvClassView=SESS.classView; SESS.pvReturn=VIEW;
  SESS.previewAsStudent=true; SESS.role='student'; SESS.prof=null;
  SESS.student={ id:PV_SID, name:'예시 학생', no:'00000000', klass:kl, __preview:true };
  pvData={ response:null, activity2:null }; draft={}; a2draft=a2Empty();
  toast('👁 학생 화면 미리보기 — 저장되지 않습니다.'); go('hub');
}
function exitStudentPreview(){
  SESS.role='prof'; SESS.prof=SESS.pvProf||SESS.prof; SESS.student=null;
  SESS.classView=SESS.pvClassView||SESS.classView||'ALL'; SESS.previewAsStudent=false;
  pvData={ response:null, activity2:null }; draft={}; a2draft=a2Empty();
  var back=SESS.pvReturn||'hub'; SESS.pvProf=null; SESS.pvReturn=null; go(back);
}
var VIEW = 'login';
var restoringSession = false;   /* 지속 로그인 복원 중(remote bootstrap 재검증 대기) */

var invalid = {}; // 미응답으로 표시된 문항 id 집합
var etcInvalid = {}; // '기타' 선택 후 내용 미입력으로 표시된 문항 id 집합

function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(function(){t.classList.remove('on');},1800); }

function render(){
  var el=document.getElementById('app');
  if(VIEW!=='a2pv') a2preview=false;   /* 미리보기 화면을 벗어나면 자동 해제 */
  if(VIEW==='login'){ el.innerHTML = viewLogin(); return; }
  var bar = topbar();
  if(VIEW==='hub'){ el.innerHTML = bar+viewHub(); return; }   /* 로그인 후 첫 화면 = 활동 목록 */
  if(SESS.role==='student'){
    if(VIEW==='consent') el.innerHTML = bar+viewConsent();
    else if(VIEW==='home') el.innerHTML = bar+viewStudentHome();
    else if(VIEW==='survey') el.innerHTML = bar+viewSurvey();
    else if(VIEW==='a2') el.innerHTML = bar+viewA2Form();
    else if(VIEW==='card') el.innerHTML = bar+viewProfileCard(SESS.student.id, true);
  } else {
    if(VIEW==='dash') el.innerHTML = bar+viewDash();
    else if(VIEW==='groups') el.innerHTML = bar+viewGroups();
    else if(VIEW==='roster') el.innerHTML = bar+viewRoster();
    else if(VIEW.indexOf('sc:')===0) el.innerHTML = bar+viewProfileCard(VIEW.slice(3), false);
    else if(VIEW==='a2list') el.innerHTML = bar+viewA2List();
    else if(VIEW==='a2pv') el.innerHTML = bar+viewA2Form();   /* 학생 화면 미리보기(읽기전용) */
    else if(VIEW.indexOf('a2v:')===0) el.innerHTML = bar+viewA2Detail(VIEW.slice(4));
  }
}

function topbar(){
  var right, mid, sel='', subnav='';
  if(SESS.role==='student'){
    mid = (isPreview()?'👁 ':'')+esc(SESS.student.name)+' · '+SESS.student.klass+'반';
    right = isPreview()
      ? '<button class="btn sm gray" onclick="go(\'hub\')">활동 목록</button>'+
        '<button class="btn sm" onclick="exitStudentPreview()">← 미리보기 종료</button>'
      : '<button class="btn sm gray" onclick="go(\'hub\')">활동 목록</button>'+
        '<button class="btn sm gray" onclick="logout()">로그아웃</button>';
  } else {
    var p=SESS.prof||{};
    mid = '🟢 '+(isSuper()?'슈퍼관리자':'관리자')+' '+esc(p.name)+' · 담당 '+p.klass+'반';
    /* 「명단 관리」는 활동과 독립된 전역 메뉴 — 로그아웃 바로 왼쪽, 교수(슈퍼+관리자)에게만 노출 */
    right = '<button class="btn sm gray" onclick="go(\'hub\')">활동 목록</button>'+
            '<button class="btn sm gray" onclick="go(\'roster\')">명단 관리</button>'+
            '<button class="btn sm" onclick="enterStudentPreview()">👁 학생으로 보기</button>'+
            '<button class="btn sm gray" onclick="logout()">로그아웃</button>';
    /* 반 선택 — 활동·명단 화면에서 표시(활동목록 hub에서는 숨김). 교수 3명 모두 전체 열람 가능 */
    if(VIEW!=='hub'){
      sel = '<div class="clsseg">'+['ALL','F1','F2','F3'].map(function(c){
        return '<button class="'+(viewClass()===c?'on':'')+'" onclick="setClassView(\''+c+'\')">'+(c==='ALL'?'전체':c)+'</button>';
      }).join('')+'</div>';
    }
    /* 하위 화면 탭 — 「활동(진로설문)」 내부에서만: 대시보드/트랙 그룹. 명단은 상단바 전역 메뉴로 분리됨. 카드(sc:)는 트랙그룹 계열 */
    if(VIEW==='dash' || VIEW==='groups' || VIEW.indexOf('sc:')===0){
      var cur=(VIEW.indexOf('sc:')===0)?'groups':VIEW;
      subnav = '<div class="subnav">'+
        '<button class="'+(cur==='dash'?'on':'')+'" onclick="go(\'dash\')">대시보드</button>'+
        '<button class="'+(cur==='groups'?'on':'')+'" onclick="go(\'groups\')">트랙 그룹</button>'+
      '</div>';
    }
  }
  var pvBanner = isPreview()
    ? '<div class="demoflag" style="background:#eef4ff;border-color:#c9dbff;color:#22407a">👁 <b>학생 화면 미리보기</b> — 지금 화면은 학생이 로그인 후 보는 모습입니다. 여기서 입력·제출해도 <b>저장되지 않습니다</b>. <button class="btn sm" style="padding:2px 10px;margin-left:4px" onclick="exitStudentPreview()">미리보기 종료</button></div>'
    : (MODE==='local'
      ? '<div class="demoflag">🧪 로컬 테스트(?demo=1) — 예시 데이터(실명 아님). 브라우저에만 저장.</div>'
      : '<div class="demoflag">🟢 서버 연결됨 — 데이터는 Supabase(서버)에 저장됩니다.</div>');
  return '<div class="top"><span class="ttl">'+APP_TITLE+'</span>'+
    '<span class="sp"></span>'+sel+'<span class="sub">'+mid+'</span> '+right+'</div>'+
    subnav+pvBanner;
}
function setClassView(c){ SESS.classView=c; render(); }

  }
  return '<div class="card" style="max-width:440px;margin:40px auto">'+
    '<h2>바이오취업역량개발</h2>'+
    '<div class="seg" style="margin:8px 0 16px">'+
      '<button class="'+(loginRole==='student'?'on':'')+'" onclick="setRole(\'student\')">학생</button>'+

    '<label>이름</label><input type="text" id="inName" placeholder="이름">'+
    '<label>'+(loginRole==='student'?'학번':'교번')+'</label><input type="text" id="inNum" placeholder="'+(loginRole==='student'?'학번':'교번')+'">'+
    '<div style="margin-top:16px"><button class="btn" onclick="doLogin()">들어가기</button></div>'+
    '<div class="muted" style="margin-top:14px">비밀번호 없이 <b>명단 대조</b>로 확인합니다(PBL 앱과 동일).<br>'+
    (MODE==='local'
      ? '예시 로그인(테스트) — 학생: <b>예시학생01 / 90000100</b> · 교수(슈퍼): <b>예시교수A / T0001</b></div>'
      : '학생은 출석부의 <b>이름 + 학번</b>, 교수는 <b>이름 + 교번</b>으로 로그인합니다.</div>')+
  '</div>';
}
function setRole(r){ loginRole=r; render(); }
function doLogin(){
  var nmR=(document.getElementById('inName').value||'').trim();
  var noR=(document.getElementById('inNum').value||'').trim();
  if(MODE==='remote'){ doLoginRemote(loginRole==='prof'?'prof':'student', nmR, noR); return; }
  var nm=nmR, no=noR;
  if(!nm||!no){ toast('이름과 '+(loginRole==='student'?'학번':'교번')+'을 넣어 주세요.'); return; }
  if(loginRole==='prof'){
    var p=PROFS.filter(function(x){return norm(x.name)===norm(nm)&&x.num===no;})[0];
    if(!p || !p.num){ toast('명단에 없는 교수 정보입니다.'); return; }
    SESS.role='prof'; SESS.prof=p; SESS.student=null; SESS.classView='ALL'; saveSession(); go('hub'); return;
  }
  var st=DB.student(nm,no);
  if(!st){ toast('출석부에 없는 학생입니다. 이름·학번을 확인해 주세요.'); return; }
  SESS.role='student'; SESS.student=st; SESS.prof=null;
  draft = (DB.response(st.id)||{}).answers ? JSON.parse(JSON.stringify(DB.response(st.id).answers)) : {};
  saveSession(); go('hub');
}
function logout(){ try{ sessionStorage.removeItem(TOKENKEY); }catch(e){} clearSession(); SESS={role:null,student:null,prof:null,classView:'ALL'}; draft={}; if(MODE==='remote'){ DB.d={students:[],responses:[],interviews:[],activity2:[]}; } go('login'); }

  if(isPreview()){ SESS.student.consent={agreed:true, at:now()}; toast('👁 미리보기 — 저장되지 않습니다.'); go(consentNext||'home'); return; }
  setConsent(SESS.student.id);
  if(MODE==='remote'){ apiCall('setConsent',{}).catch(function(){}); }
  toast('동의가 저장되었습니다.'); go(consentNext||'home');
}

function viewHub(){
  var isStudent=SESS.role==='student';
  var done = isStudent && !isEarly(SESS.student) && !!DB.response(SESS.student.id);
  var exempt = isStudent && isEarly(SESS.student);
  var intro = isStudent

/* ---- 설문 위저드(단계별 페이지 넘김) ---- */
/* 단계: A(진로 방향) → T(트랙 문항, 미정이면 스킵) → D(대학원) → E(마무리) */
function activeSteps(){
  var s=[{key:'A', name:'진로 방향', intro:'먼저 졸업 후 진로 방향을 정해 주세요.'}];
  if(draft.A1 && draft.A1!=='미정') s.push({key:'T', name:'트랙 문항', intro:'선택한 진로에 맞는 문항입니다.'});
  s.push({key:'D', name:'대학원', intro:'대학원 진학 계획을 알려 주세요.'});
  s.push({key:'E', name:'마무리', intro:'마지막 단계입니다. 다 채우고 [제출]을 눌러 주세요.'});
  return s;
}
function stepKeyMatch(id, key){
  var c=id.charAt(0);
  if(key==='A') return c==='A';
  if(key==='T') return c==='B'||c==='C'||c==='F';
  if(key==='D') return c==='D';
  if(key==='E') return c==='E';
  return false;
}
function viewSurvey(){
  var steps=activeSteps();
  if(stepIdx>=steps.length) stepIdx=steps.length-1;
  if(stepIdx<0) stepIdx=0;
  var cur=steps[stepIdx];
  var editingSurvey = SESS.role==='student' && SESS.student && !!DB.response(SESS.student.id);
  var head=steps.map(function(s,i){
    var cls='wstep'+(i===stepIdx?' on':(i<stepIdx?' done':''));
    return '<div class="'+cls+'">'+(i+1)+'. '+s.name+'</div>';
  }).join('');
  var h='<div class="card"><div class="wizard-head">'+head+'</div>'+
        '<div class="wprog">'+(stepIdx+1)+' / '+steps.length+' 단계</div>'+
        '<div class="stephead">'+cur.name+'</div>'+
        '<p class="muted">'+cur.intro+'</p>'+
        (editingSurvey?'<div class="note" style="margin:8px 0;background:#eef4ff;border-color:#c9dbff">✏️ 이미 제출한 응답을 <b>수정하는 중</b>입니다. 값을 바꾼 뒤 마지막 단계에서 <b>[수정 저장]</b>을 누르면 새 내용으로 저장됩니다.</div>':'');
  var nBad=Object.keys(invalid).length;
  if(showValidateMsg && nBad){
    h+='<div class="validbanner">⚠️ 아직 답하지 않은 문항이 있습니다 ('+nBad+'개). 붉게 표시된 문항을 채워 주세요.</div>';
  }
  var any=false;
  Q.forEach(function(item){
    if(item.sec) return;
    if(!stepKeyMatch(item.id, cur.key)) return;
    if(item.show && !item.show(draft)) return;
    h+= renderQ(item); any=true;
  });
  if(!any) h+='<p class="muted" style="margin:16px 0">이 단계에서 응답할 문항이 없습니다.</p>';
  var last = stepIdx===steps.length-1;
  h+='<div class="navrow">'+
      '<div>'+(stepIdx>0
        ? '<button class="btn gray" onclick="prevStep()">← 이전</button>'
        : '<button class="btn gray" onclick="go(\'home\')">취소</button>')+'</div>'+
      '<div>'+(last
        ? '<button class="btn" onclick="submitSurvey()">'+(editingSurvey?'수정 저장':'제출')+'</button>'
        : '<button class="btn" onclick="nextStep()">다음 →</button>')+'</div>'+
     '</div></div>';
  return h;
}
/* 지금 단계에서 화면에 보이는(show 통과) 필수 문항 중 미응답인 것 목록 */
function isEmptyAns(item){
  var v=draft[item.id];
  if(item.type==='multi') return !(v && v.length);
  if(item.type==='scale') return !(v>=1 && v<=5);
  return v===undefined || v===null || (''+v).trim()==='';
}
function validateStep(){
  var steps=activeSteps(); var cur=steps[stepIdx];
  invalid={}; etcInvalid={};
  Q.forEach(function(item){
    if(item.sec) return;
    if(!stepKeyMatch(item.id, cur.key)) return;
    if(item.show && !item.show(draft)) return;   // 조건부 숨김 문항은 검사 제외
    if(hasEtcOpt(item) && etcSelected(item, draft) && etcEmpty(item.id)){ invalid[item.id]=true; etcInvalid[item.id]=true; return; }
    if(item.optional) return;                     // 선택 문항은 비워도 통과
    if(isEmptyAns(item)) invalid[item.id]=true;
  });
  return Object.keys(invalid);
}
function scrollToInvalid(){
  setTimeout(function(){
    var el=document.querySelector('.qcard.invalid');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 40);
}
function nextStep(){
  var bad=validateStep();
  if(bad.length){ showValidateMsg=true; render(); scrollToInvalid(); return; }
  showValidateMsg=false; invalid={};
  var steps=activeSteps();
  if(stepIdx<steps.length-1){ stepIdx++; render(); window.scrollTo(0,0); }
}
function prevStep(){ showValidateMsg=false; invalid={}; if(stepIdx>0){ stepIdx--; render(); window.scrollTo(0,0); } }
/* ── '기타' 직접입력 공통 처리 — opt에 '기타'가 있는 모든 문항에 자동 적용 ── */
function hasEtcOpt(item){ return !!(item && item.opt && item.opt.indexOf('기타')>=0); }
function etcSelected(item, a){ var v=a[item.id]; if(item.type==='multi') return !!(v && v.indexOf && v.indexOf('기타')>=0); return v==='기타'; }
function etcEmpty(id){ var e=draft.etc&&draft.etc[id]; return !(e && String(e).trim()!==''); }
/* 결과 표시용 — 다중선택 값(+기타 직접입력) */
function joinEtc(a, id){ var v=a[id]; var e=a&&a.etc&&a.etc[id]; var hasE=!!(e&&String(e).trim()!==''); var s; if(Array.isArray(v)){ var list=hasE? v.filter(function(x){return x!=='기타';}) : v; s=list.join(', '); } else { s=(v==null?'':v); } if(hasE) s=s+(s?' · ':'')+'기타(직접입력): '+e; return s||'—'; }
/* 결과 표시용 — 단일선택 값(+기타 직접입력) */
function oneEtc(a, id){ var v=a[id]; var e=a&&a.etc&&a.etc[id]; if(v==='기타' && e && String(e).trim()!=='') return '기타(직접입력): '+e; return (v==null||v==='')?'—':v; }
function renderQ(item){
  var v=draft[item.id];
  var bad = !!invalid[item.id];
  var req = item.optional ? ' <span class="hint">(선택)</span>' : '<span class="reqmark">*</span>';
  var h='<div class="qcard'+(bad?' invalid':'')+'"><div class="qhead"><span class="qbadge">'+item.id+'</span><span>'+item.q+req+'</span></div>';
  if(item.type==='single'){
    h+= item.opt.map(function(o){
      return '<label class="opt"><input type="radio" name="'+item.id+'" '+(v===o?'checked':'')+' onchange="setSingle(\''+item.id+'\',\''+esc(o)+'\')">'+o+'</label>';
    }).join('');
  } else if(item.type==='multi'){
    v=v||[];
    h+= item.opt.map(function(o){
      return '<label class="opt"><input type="checkbox" '+(v.indexOf(o)>=0?'checked':'')+' onchange="toggleMulti(\''+item.id+'\',\''+esc(o)+'\')">'+o+'</label>';
    }).join('');
  } else if(item.type==='scale'){
    h+='<div class="row">'+[1,2,3,4,5].map(function(n){
      return '<label class="opt"><input type="radio" name="'+item.id+'" '+(v===n?'checked':'')+' onchange="setSingle(\''+item.id+'\','+n+')">'+n+'</label>';
    }).join('')+'<span class="hint">1=낮음 ~ 5=높음</span></div>';
  } else if(item.type==='text'){
    h+='<input type="text" value="'+(v?esc(v):'')+'" oninput="setText(\''+item.id+'\',this.value)">';
  } else if(item.type==='textarea'){
    h+='<textarea oninput="setText(\''+item.id+'\',this.value)">'+(v?esc(v):'')+'</textarea>';
  } else if(item.type==='num'){
    h+='<input type="number" step="0.01" value="'+(v!=null?v:'')+'" oninput="setText(\''+item.id+'\',this.value)" style="max-width:160px">';
  }
  if(hasEtcOpt(item) && etcSelected(item, draft)){
    var ev=(draft.etc&&draft.etc[item.id])||'';
    h+='<div style="margin-top:8px"><input type="text" value="'+(ev?esc(ev):'')+'" placeholder="\'기타\'를 선택하셨습니다 — 내용을 직접 입력하세요" oninput="setEtc(\''+item.id+'\',this.value)">';
    if(etcInvalid[item.id]) h+='<div class="qerr">\'기타\' 내용을 입력해 주세요.</div>';
    h+='</div>';
  }
  if(bad) h+='<div class="qerr">'+(item.reqMsg||'이 문항에 응답해 주세요.')+'</div>';
  return h+'</div>';
}
function setSingle(id,val){ draft[id]=val; delete invalid[id]; delete etcInvalid[id]; if(val!=='기타' && draft.etc) delete draft.etc[id]; render(); }
function setText(id,val){ draft[id]=val; if((''+val).trim()!=='') delete invalid[id]; }   // 텍스트는 재렌더 안 함(커서 유지)
function setEtc(id,val){ if(!draft.etc) draft.etc={}; draft.etc[id]=val; if((''+val).trim()!==''){ delete invalid[id]; delete etcInvalid[id]; } }   // 기타 직접입력 — 재렌더 안 함(커서 유지)
function toggleMulti(id,val){
  var a=draft[id]||[]; var i=a.indexOf(val);
  if(i>=0) a.splice(i,1); else a.push(val);
  draft[id]=a;
  if(a.length) delete invalid[id];
  if(val==='기타'){                          // 기타 체크/해제 시 입력란 표시·숨김
    if(a.indexOf('기타')<0){ if(draft.etc) delete draft.etc[id]; delete etcInvalid[id]; }
    render();
  }
}
function submitSurvey(){
  var bad=validateStep();
  if(bad.length){ showValidateMsg=true; render(); scrollToInvalid(); return; }
  showValidateMsg=false; invalid={};
  var track = draft.A1;
  var ans = JSON.parse(JSON.stringify(draft));
  if(isPreview()){ pvData.response={ id:'pv', student_id:PV_SID, track:track, answers:ans, submitted_at:now() }; toast('👁 미리보기 — 실제로 저장되지 않았습니다.'); go('card'); return; }
  if(MODE==='remote'){
    /* 서버(Supabase) 저장 성공을 확인한 뒤에만 완료 처리 — 저장 실패를 '완료'로 오인하지 않도록 */
    if(submitting) return;                       /* 중복 제출(경쟁 조건) 방지 */
    submitting=true;
    apiCall('saveResponse',{track:track, answers:ans}).then(function(res){
      submitting=false;
      if(!res.j || res.j.ok!==true){ toast((res.j&&res.j.error)||'서버 저장에 실패했습니다. 잠시 후 다시 제출해 주세요.'); return; }
      DB.saveResponse(SESS.student.id, track, ans);   /* 서버 저장 성공 후에만 로컬 반영 → 완료 표시 */
      toast('제출되었습니다.'); go('card');
    }).catch(function(){ submitting=false; toast('서버 연결에 실패했습니다. 잠시 후 다시 제출해 주세요.'); });
    return;
  }
  /* local(?demo=1) — 브라우저 저장(동기) */
  DB.saveResponse(SESS.student.id, track, ans);
  toast('제출되었습니다.');
  go('card');
}

/* ── 진로 프로필을 「항목명: 값」 한 줄씩 정돈된 텍스트로 ── */
function profileText(sid){
  var st=DB.d.students.filter(function(x){return x.id===sid;})[0];
  var r=DB.response(sid); if(!st||!r) return '';
  var a=r.answers, L=[];
  function J(x){ return (x&&x.length)? (x.join? x.join(', ') : x) : ''; }

/* file:// 에서도 되는 복사 — clipboard API 실패 시 execCommand fallback */
function copyText(text){
  function fallback(){
    try{
      var ta=document.createElement('textarea'); ta.value=text;
      ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok=document.execCommand('copy'); ta.remove(); return ok;
    }catch(e){ return false; }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('복사됐습니다.'); },
      function(){ toast(fallback()?'복사됐습니다.':'복사가 막혔습니다 — 텍스트 다운로드를 이용하세요.'); });
  }else{
    toast(fallback()?'복사됐습니다.':'복사가 막혔습니다 — 텍스트 다운로드를 이용하세요.');
  }
}

function downloadBlob(name, text, mime){
  try{
    var b=new Blob(['﻿'+text],{type:(mime||'text/plain')+';charset=utf-8'});
    var u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },900);
    toast(name+' 을(를) 내려받았습니다.');
  }catch(e){ toast('다운로드가 막혔습니다 — 복사 버튼을 이용하세요.'); }
}

function allProfilesText(){
  var SEP='──────────────────────────────';
  var blocks=[], missing=[];
  viewStudents().forEach(function(st){
    if(isEarly(st)){
      blocks.push('[조기취업] '+st.name+' ('+st.no+')'+(st.earlyCompany?' — 취업처: '+st.earlyCompany:''));
      return;
    }
    var r=DB.response(st.id);
    if(!r){ missing.push(st.name+'('+st.no+')'); return; }
    blocks.push(profileText(st.id));
  });
  if(!blocks.length) return '';   /* 프로필·조기취업 블록이 하나도 없으면(전원 미응답 등) 빈 값 → 안내 */
  var out=blocks.join('\n\n'+SEP+'\n\n');
  if(missing.length) out += '\n\n'+SEP+'\n\n※ 미응답: '+missing.join(', ');
  return out;
}

function barTable(obj, max){

}

/* 사진 압축 — 유전자분석 앱(gene-analysis-lab)에서 검증된 방식 이식(2026-09-07).
 *  · objectURL 우선(수십MB 원본을 base64로 통째 읽지 않아 메모리 절약) → 실패 시 FileReader 폴백(구형 사파리·일부 HEIC).

function a2Compress(file, done){
  if(!file || !/^image\//.test(file.type||'')){ done(null,'이미지 파일이 아닙니다.'); return; }

      /* 원본이 목표의 2배보다 크면 절반씩 단계적으로 줄여 화질 유지·실패 방지 */

      ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,ch); ctx.drawImage(src,0,0,cw,ch);

        im2.src=fr.result;
      };

    }catch(e){ fail('이미지를 여는 데 실패했습니다.'); }
  }

  img.onload=function(){ draw(img); };

    });

}

var SS_KEY = (MODE==='local') ? 'biocareer_session_demo' : 'biocareer_session';
function saveSession(){
  if(SESS && SESS.previewAsStudent) return;           /* 미리보기 세션은 저장 안 함 */
  if(!SESS || !SESS.role) return;
  var s={ v:1, mode:MODE, role:SESS.role };
  if(MODE==='remote'){ var tk=''; try{ tk=sessionStorage.getItem(TOKENKEY)||''; }catch(e){} if(!tk) return; s.token=tk; }
  if(SESS.role==='prof'){ var p=SESS.prof||{}; s.prof={ name:p.name, num:(MODE==='remote'?'':(p.num||'')), klass:p.klass, role:p.role }; }
  else { var st=SESS.student||{}; s.studentId=st.id; s.name=st.name; s.no=st.no; }
  try{ localStorage.setItem(SS_KEY, JSON.stringify(s)); }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem(SS_KEY); }catch(e){} }
function failRestore(){ clearSession(); try{ sessionStorage.removeItem(TOKENKEY); }catch(e){} restoringSession=false; SESS={role:null,student:null,prof:null,classView:'ALL'}; draft={}; go('login'); }
/* 저장된 세션 복원 시도. remote는 저장 토큰으로 bootstrap 재검증(만료·무효면 조용히 로그인 화면).
   true 반환 시 remote는 비동기로 자체 render 처리, local은 VIEW만 세팅(호출부에서 render). */
function tryRestoreSession(){
  var raw; try{ raw=localStorage.getItem(SS_KEY); }catch(e){ return false; }
  if(!raw) return false;
  var s; try{ s=JSON.parse(raw); }catch(e){ clearSession(); return false; }
  if(!s || s.mode!==MODE || !s.role){ clearSession(); return false; }
  if(MODE==='remote'){
    if(!s.token){ clearSession(); return false; }
    try{ sessionStorage.setItem(TOKENKEY, s.token); }catch(e){}
    restoringSession=true; VIEW='login'; render();     /* 복원 중 안내 표시 */
    apiCall('bootstrap',{}).then(function(bs){
      if(bs.status!==200 || !bs.j || bs.j.error){ failRestore(); return; }
      applyBootstrap(bs.j);
      if(s.role==='prof'){
        var pr=s.prof||{}; SESS={role:'prof', student:null, prof:{name:pr.name, num:'', klass:pr.klass, role:pr.role}, classView:'ALL'};
      } else {
        var st=DB.d.students.filter(function(x){return x.id===s.studentId;})[0];
        if(!st){ failRestore(); return; }
        SESS={role:'student', student:st, prof:null, classView:'ALL'};
        draft = (DB.response(st.id)||{}).answers ? JSON.parse(JSON.stringify(DB.response(st.id).answers)) : {};
      }
      restoringSession=false; go('hub');
    }).catch(function(){ failRestore(); });
    return true;
  }
  /* local(?demo=1) */
  if(s.role==='prof'){
    var pn=(s.prof&&s.prof.name), pu=(s.prof&&s.prof.num);
    var p=PROFS.filter(function(x){return norm(x.name)===norm(pn)&&x.num===pu;})[0];
    if(!p || !p.num){ clearSession(); return false; }
    SESS={role:'prof', prof:p, student:null, classView:'ALL'}; VIEW='hub'; return true;
  } else {
    var lst=DB.student(s.name, s.no);
    if(!lst){ clearSession(); return false; }
    SESS={role:'student', student:lst, prof:null, classView:'ALL'};
    draft = (DB.response(lst.id)||{}).answers ? JSON.parse(JSON.stringify(DB.response(lst.id).answers)) : {};
    VIEW='hub'; return true;
  }
}
var PV_WRITE_ACTIONS={setConsent:1,saveResponse:1,saveActivity2:1,setEarly:1,deleteStudent:1,addStudent:1,updateStudent:1,deleteClass:1,registerRoster:1,setActivityActive:1};
function apiCall(action, params){
  if(SESS&&SESS.previewAsStudent&&PV_WRITE_ACTIONS[action]){
    toast('👁 미리보기 — 저장되지 않습니다.');
    return Promise.resolve({status:0, j:{ok:false, error:'미리보기 모드 — 저장되지 않습니다.', preview:true}});
  }
  return fetch(DBCONF.url+'/functions/v1/api', {
    method:'POST',
    headers:{'Authorization':'Bearer '+DBCONF.anon, 'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({action:action, token:sessionStorage.getItem(TOKENKEY)||''}, params||{}))
  }).then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); });
}
function mapStudent(s){ return {id:s.id, name:s.name, no:s.no, klass:s.klass, earlyEmployed:!!s.early_employed, earlyCompany:s.early_company||'', consent: s.consent_at?{agreed:true, at:s.consent_at}:undefined}; }
function mapResp(r){ return {id:r.id, student_id:r.student_id, klass:r.klass, track:r.track, answers:r.answers||{}, submitted_at:r.submitted_at}; }
function applyBootstrap(d){
  if(d.classes && d.classes.length){ CLASSES = d.classes.map(function(c){ return {id:c.id, prof:c.prof||''}; }); }
  if(d.activities && d.activities.length){ d.activities.forEach(function(sa){ var c=ACTIVITIES.filter(function(x){return x.n===sa.n;})[0]; if(c){ c.active=!!sa.active; if(sa.name) c.name=sa.name; } }); }
  DB.d.students  = (d.students||[]).map(mapStudent);
  DB.d.responses = (d.responses||[]).map(mapResp);
  DB.d.activity2 = (d.activity2||[]).map(function(r){ return {id:r.id, student_id:r.student_id, klass:r.klass, assets:r.assets||'', pros:r.pros||[], cons:r.cons||[], photos:(r.photos&&r.photos.slice)?r.photos:null, submitted_at:r.submitted_at}; });
  DB.d.interviews = DB.d.interviews||[];
}
function doLoginRemote(role, nm, no){
  if(!nm||!no){ toast('이름과 '+(role==='prof'?'교번':'학번')+'을 넣어 주세요.'); return; }
  toast('로그인 중…');
  fetch(DBCONF.url+'/functions/v1/api', {
    method:'POST', headers:{'Authorization':'Bearer '+DBCONF.anon,'Content-Type':'application/json'},
    body:JSON.stringify({action:'login', role:role, name:nm, num:no})
  }).then(function(r){ return r.json().then(function(j){ return {s:r.status, j:j}; }); })
  .then(function(res){
    if(!res.j || !res.j.ok){ toast((res.j&&res.j.error)||'로그인에 실패했습니다.'); return; }
    sessionStorage.setItem(TOKENKEY, res.j.token);
    var user=res.j.user;
    return apiCall('bootstrap',{}).then(function(bs){
      if(bs.status!==200){ toast('데이터를 불러오지 못했습니다.'); return; }
      applyBootstrap(bs.j);
      if(role==='prof'){ SESS={role:'prof', student:null, prof:{name:user.name, num:'', klass:user.klass, role:user.role}, classView:'ALL'}; }
      else { var st=DB.d.students.filter(function(s){return s.id===user.id;})[0]||mapStudent({id:user.id,name:user.name,no:user.no,klass:user.klass}); SESS={role:'student', student:st, prof:null, classView:'ALL'};
        /* 제출한 응답을 수정할 수 있도록, 서버(bootstrap)에서 불러온 기존 응답을 설문 초안에 채운다 */
        draft = (DB.response(st.id)||{}).answers ? JSON.parse(JSON.stringify(DB.response(st.id).answers)) : {}; }
      saveSession();
      go('hub');
    });
  }).catch(function(){ toast('서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.'); });
}
/* 변경 후 서버 기준으로 다시 로드(권한·id 정합성) */
function refreshRemote(){ return apiCall('bootstrap',{}).then(function(bs){ if(bs.status===200){ applyBootstrap(bs.j); render(); } }); }
/* 원격 쓰기 — 실패 시 안내 + 재동기화 */
function remoteWrite(action, params, okMsg){
  apiCall(action, params).then(function(res){
    if(!res.j || res.j.ok!==true){ toast((res.j&&res.j.error)||'저장에 실패했습니다.'); refreshRemote(); return; }
    if(okMsg) toast(okMsg);
    refreshRemote();
  }).catch(function(){ toast('서버 연결 실패 — 다시 시도해 주세요.'); });
}

/* ============================================================================
   5. 시작
   ========================================================================== */
if(MODE==='local'){ PROFS = DEMO_SEED.profs; }   /* ?demo=1 로컬 테스트 계정 */
DB.load(); DB.seed();
var _restored = tryRestoreSession();   /* 저장된 로그인 세션 복원 시도 */
if(!(MODE==='remote' && _restored)){ render(); }   /* remote 복원은 비동기로 자체 render */
</script>
